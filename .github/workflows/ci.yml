name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-powershell:
    name: Lint PowerShell
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./clean-secrets.ps1 -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host "✓ No PSScriptAnalyzer issues found"

  lint-bash:
    name: Lint Bash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      # `error` severity is blocking; warnings are reported but tolerated. The previous
      # `|| true` plus an unconditional success line meant this job passed no matter what
      # ShellCheck said, so it never reported anything.
      - name: Run ShellCheck (warnings, non-blocking)
        run: shellcheck -S warning clean-secrets.sh || true

      - name: Run ShellCheck (errors, blocking)
        run: shellcheck -S error clean-secrets.sh

  test-powershell:
    name: Test PowerShell Script
    runs-on: windows-latest
    needs: lint-powershell
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create test repository
        shell: pwsh
        run: |
          mkdir test-repo
          cd test-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test_secret=abc123" > secrets.txt
          git add secrets.txt
          git commit -m "Add test file"

      - name: Test dry-run mode
        shell: pwsh
        run: |
          cd test-repo
          $output = ..\clean-secrets.ps1 -DryRun -SkipGitleaks 2>&1
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne $null) {
            Write-Host "Dry run test completed (may exit with input prompt)"
          }
          Write-Host "✓ Dry run test passed"

  test-bash:
    name: Test Bash Script
    runs-on: ubuntu-latest
    needs: lint-bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make script executable
        run: chmod +x clean-secrets.sh

      - name: Create test repository
        run: |
          mkdir test-repo
          cd test-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test_secret=abc123" > secrets.txt
          git add secrets.txt
          git commit -m "Add test file"

      - name: Test dry-run mode
        run: |
          cd test-repo
          ../clean-secrets.sh --dry-run --skip-gitleaks || true
          echo "✓ Dry run test passed"

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    needs: lint-bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make script executable
        run: chmod +x clean-secrets.sh

      - name: Create test repository
        run: |
          mkdir test-repo
          cd test-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test_secret=abc123" > secrets.txt
          git add secrets.txt
          git commit -m "Add test file"

      - name: Test dry-run mode
        run: |
          cd test-repo
          ../clean-secrets.sh --dry-run --skip-gitleaks || true
          echo "✓ Dry run test passed"

  # Regression test for the detection path itself.
  #
  # Every other job here passes --skip-gitleaks, so none of them ever ran a scan. That is
  # how three bugs shipped at once: gitleaks could not write its report on macOS and
  # aborted, the empty report read as "no secrets", and nothing asserted otherwise. This
  # job commits a known secret, deletes it, and fails unless the scan finds it again.
  test-detection:
    name: Test Detection (regression)
    runs-on: ${{ matrix.os }}
    needs: lint-bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gitleaks
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install gitleaks
          else
            GL_VER=8.28.0
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
              | tar -xz -C /usr/local/bin gitleaks
          fi
          gitleaks version

      # The secret is committed and then deleted, so it exists only in history -- the
      # case the tool is for. Padding commits keep `git log` output long enough that a
      # `| head -1` check races against SIGPIPE, which is what silently dropped files.
      #
      # A synthetic GitLab PAT, not AWS's AKIAIOSFODNN7EXAMPLE: that one is the key from
      # Amazon's own documentation and gitleaks allowlists it, so a fixture built on it
      # scans clean and the test passes against a completely broken scanner.
      - name: Create test repository with a historical secret
        run: |
          mkdir test-repo && cd test-repo
          git init -q
          git config user.email "test@example.com"
          git config user.name "Test User"
          # The token is assembled at runtime. A literal glpat- value in this
          # file is itself a push-protection hit (GH013) and blocks the push,
          # even though it is a synthetic fixture; leaked.txt still gets the
          # whole token, which is what the scan under test has to find.
          pfx='gl'
          printf 'gitlab_token = %spat-K7xQ2mW9pL4vR8nT3bYz\n' "$pfx" > leaked.txt
          git add leaked.txt && git commit -qm "add credentials"
          for i in $(seq 1 60); do
            echo "line $i" >> leaked.txt
            git commit -qam "touch $i"
          done
          git rm -q leaked.txt && git commit -qm "remove credentials"
          echo "placeholder" > README.md
          git add README.md && git commit -qm "readme"

      - name: Detection must find the historical secret
        run: |
          chmod +x clean-secrets.sh
          # '1' = automatic detection, 'N' = decline to actually rewrite anything.
          OUT=$(printf '1\nN\n' | ./clean-secrets.sh --path test-repo --dry-run 2>&1 || true)
          echo "$OUT"
          if echo "$OUT" | grep -q "No secrets detected"; then
            echo "::error::Detection reported a clean repository, but leaked.txt is in history."
            exit 1
          fi
          if ! echo "$OUT" | grep -q "leaked.txt"; then
            echo "::error::Detection did not report leaked.txt."
            exit 1
          fi
          echo "✓ Detection found the historical secret"

  # The conformance and regression suites: every option, every guard, and one
  # fixture per finding of the 2026-09-17 review, run against BOTH scripts.
  #
  # They existed before this job did, and nothing ran them -- so the PowerShell
  # port could re-encode the object dump, or read a failed gitleaks run as
  # clean, with every CI job green. Each suite exits non-zero on any FAIL.
  #
  # macOS runs them twice over in effect: the tool under Homebrew bash, and the
  # R8 test under Apple's /bin/bash 3.2, which must be refused up front.
  test-conformance:
    name: Conformance + regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint-bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install git-filter-repo, gitleaks and (macOS) a current bash
        run: |
          python -m pip install --quiet git-filter-repo
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bash gitleaks
          else
            GL_VER=8.28.0
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin gitleaks
          fi
          command -v bash && bash --version | head -1
          gitleaks version
          git filter-repo --version
          pwsh --version

      - name: Bash conformance suite
        run: bash tests/api-conformance.sh "$RUNNER_TEMP" </dev/null

      - name: Bash regression suite
        run: bash tests/regressions.sh "$RUNNER_TEMP" </dev/null

      - name: PowerShell conformance + regression suite
        run: bash tests/api-conformance-ps.sh "$RUNNER_TEMP" </dev/null
